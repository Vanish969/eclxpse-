<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@eclipse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
    color:white;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:url('https://i.imgur.com/s4l3UdA.gif') center/cover no-repeat fixed;
    filter:brightness(0.45);
    z-index:-1;
}

.card{
    width:340px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.35);
    transition:transform 0.05s linear;
}

.avatar-wrapper{
    position:relative;
    width:90px;
    height:90px;
    margin:auto;
}

.avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    position:absolute;
    top:7px;
    left:7px;
}

.decoration{
    width:90px;
    height:90px;
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
}

.status-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    position:absolute;
    bottom:10px;
    right:12px;
    border:3px solid #1b1b1b;
}

.online{background:#43b581;}
.idle{background:#faa61a;}
.dnd{background:#f04747;}
.offline{background:#747f8d;}

h2{
    margin-top:15px;
    font-size:26px;
}

.username{
    color:#b9bbbe;
    font-size:15px;
    margin-top:3px;
}

.custom-status{
    margin-top:12px;
    color:#ddd;
    font-size:14px;
}

.custom-status img{
    width:20px;
    height:20px;
    vertical-align:middle;
    margin-right:5px;
}

.activity{
    margin-top:10px;
    color:#999;
    font-size:13px;
}

.bio{
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    color:white;
    min-height:20px;
}

#typing::after{
    content:'|';
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

#gate{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
    transition:0.6s ease;
}

.gate-box{
    text-align:center;
    color:white;
    font-family:Arial;
}

.gate-box h1{
    font-size:22px;
    letter-spacing:4px;
}

.socials{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.socials a{
    width:35px;
    height:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
    text-decoration:none;
    transition:0.2s;
}

.socials a:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

* {
    -webkit-tap-highlight-color: transparent;
    outline: none;
}
</style>
</head>
<body>

<div class="card">
    <div class="avatar-wrapper">
        <img id="avatar" class="avatar">
        <img id="decoration" class="decoration" style="display:none;">
        <div id="statusDot" class="status-dot offline"></div>
    </div>

    <h2 id="displayName"></h2>
    <div class="username" id="username"></div>

    <div class="bio"><span id="typing"></span></div>

    <div class="custom-status" id="customStatus">No custom status</div>
    <div class="activity" id="activity"></div>

    <div class="socials">
        <a href="https://instagram.com/menacexnt" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://tiktok.com/@menacexnt" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://discord.com/users/1153336356345491547" target="_blank"><i class="fa-brands fa-discord"></i></a>
    </div>
</div>

<div id="gate" onclick="enterSite()">
    <div class="gate-box">
        <h1>doxx me</h1>
        <audio id="bgmusic" src="vanishhhh.mp3"></audio>
    </div>
</div>

<script>

const userId = "1153336356345491547";

async function loadProfile(){
    const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
    const json = await res.json();
    const data = json.data;
    const user = data.discord_user;

    document.getElementById("displayName").innerText =
        user.display_name || user.global_name || user.username;

    document.getElementById("username").innerText =
        "@" + user.username;

    document.getElementById("avatar").src =
        `https://cdn.discordapp.com/avatars/${userId}/${user.avatar}.png?size=256`;

    const status = data.discord_status;
    const dot = document.getElementById("statusDot");

    dot.className =
        "status-dot " +
        (status === "online" ? "online" :
        status === "idle" ? "idle" :
        status === "dnd" ? "dnd" : "offline");

    let customHTML = "No custom status";

    if(data.activities){
        const customActivity = data.activities.find(a => a.type === 4);

        if(customActivity){
            let emojiHTML = "";

            if(customActivity.emoji){
                if(customActivity.emoji.id){
                    emojiHTML = `<img src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.png">`;
                } else {
                    emojiHTML = `<span>${customActivity.emoji.name}</span>`;
                }
            }

            customHTML = emojiHTML + (customActivity.state || "");
        }
    }

    document.getElementById("customStatus").innerHTML = customHTML;

    let activities = data.activities || [];
    activities = activities.filter(a => a.type !== 4);

    let activityText = "";

    if(activities.length === 0){
        activityText = "No activity";
    } else {
        activityText = activities.map(a => {
            if(a.type === 0) return "Playing " + a.name;
            if(a.type === 1) return "Streaming " + a.name;
            if(a.type === 2) return "Listening to Spotify";
            if(a.type === 3) return "Watching " + a.name;
            return a.name;
        }).join(" • ");
    }

    document.getElementById("activity").innerText = activityText;

    if(user.avatar_decoration_data){
        const deco = user.avatar_decoration_data.asset;
        document.getElementById("decoration").src =
        `https://cdn.discordapp.com/avatar-decoration-presets/${deco}.png?size=256`;
        document.getElementById("decoration").style.display = "block";
    }
}

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

const card = document.querySelector(".card");

document.addEventListener("click", function(e){
    if(document.getElementById("gate").style.display === "none"){
        let w = window.innerWidth / 2;
        let h = window.innerHeight / 2;

        let x = (e.clientX - w) / w;
        let y = (e.clientY - h) / h;

        targetX = y * -30;
        targetY = x * 30;
    }
});

function animateCard(){
    currentX += (targetX - currentX) * 0.15;
    currentY += (targetY - currentY) * 0.15;

    if(card){
        card.style.transform =
        `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
    }

    requestAnimationFrame(animateCard);
}

animateCard();

let started = false;

function typeText(){
    if(started) return;
    started = true;

    const text = "bitches luv me";
    let i = 0;

    function run(){
        if(i < text.length){
            document.getElementById("typing").innerHTML += text.charAt(i);
            i++;
            setTimeout(run, 150);
        }
    }

    run();
}

function enterSite(){
    const gate = document.getElementById("gate");

    gate.style.opacity = "0";

    setTimeout(() => {
        gate.style.display = "none";

        const music = document.getElementById("bgmusic");
        music.volume = 0.5;
        music.play();

        typeText();
        loadProfile();
    }, 600);
}

setInterval(loadProfile, 10000);

</script>

</body>
</html>
