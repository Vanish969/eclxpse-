<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@eclipse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    outline:none;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
    color:white;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:url('https://i.imgur.com/2MlFBcG.gif') center/cover no-repeat fixed;
    filter:brightness(0.45);
    z-index:-1;
}

.card{
    width:340px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.35);
    transition:transform 0.05s linear;
    position:relative;
    z-index:5;
}

.avatar-wrapper{
    position:relative;
    width:90px;
    height:90px;
    margin:auto;
}

.avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    position:absolute;
    top:7px;
    left:7px;
}

.decoration{
    width:90px;
    height:90px;
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
}

.status-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    position:absolute;
    bottom:10px;
    right:12px;
    border:3px solid #1b1b1b;
}

.online{background:#43b581;}
.idle{background:#faa61a;}
.dnd{background:#f04747;}
.offline{background:#747f8d;}

h2{
    margin-top:15px;
    font-size:26px;
}

.username{
    color:#b9bbbe;
    font-size:15px;
    margin-top:3px;
}

.custom-status{
    margin-top:12px;
    color:#ddd;
    font-size:14px;
}

.custom-status img{
    width:20px;
    height:20px;
    vertical-align:middle;
    margin-right:5px;
}

.activity{
    margin-top:10px;
    color:#999;
    font-size:13px;
}

.bio{
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    color:white;
    min-height:20px;
}

#typing::after{
    content:'|';
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

#gate{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
    transition:0.6s ease;
}

.gate-box{
    text-align:center;
    color:white;
}

.gate-box h1{
    font-size:22px;
    letter-spacing:4px;
}

.socials{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.socials a{
    width:35px;
    height:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
    text-decoration:none;
    transition:0.2s;
}

.socials a:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

.music-player{
    position:fixed;
    top:50%;
    left:calc(50% + 230px);
    transform:translateY(-50%);

    width:260px;

    padding:14px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:0 0 25px rgba(0,0,0,.35);

    overflow:hidden;

    z-index:1;
}



.cover{
    width:100%;
    height:130px;
    border-radius:18px;
    object-fit:cover;
}

.music-info{
    margin-top:12px;
}

.song-name{
    font-size:16px;
    font-weight:700;
}

.artist-name{
    margin-top:4px;
    color:rgba(255,255,255,.7);
    font-size:13px;
}

.progress{
    width:100%;
    margin-top:16px;
    appearance:none;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
}

.time{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:rgba(255,255,255,.7);
}

.controls{
    margin-top:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.controls button{
    background:none;
    border:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.play-btn{
    font-size:42px !important;
}

.volume-wrap{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
}

.volume{
    flex:1;
    appearance:none;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
}

.volume::-webkit-slider-thumb{
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:white;
}

.servers-box{
    position:fixed;

    top:50%;
    right:calc(50% + 230px);

    transform:translateY(-50%);

    width:260px;

    padding:16px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:0 0 25px rgba(0,0,0,.35);
}

.server-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.server-item{
    display:flex;
    align-items:center;

    gap:12px;

    padding:10px;

    border-radius:14px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.04);

    margin-bottom:10px;
}

.server-item img{
    width:48px;
    height:48px;

    border-radius:14px;
}

.server-name{
    font-size:15px;
    font-weight:bold;
}

.server-members{
    font-size:12px;
    color:#aaa;
}

.server-item{
    display:flex;
    align-items:center;

    gap:12px;

    padding:12px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.04);

    margin-bottom:12px;

    transition:.2s;
}

.server-item:hover{
    background:rgba(255,255,255,0.08);
    transform:scale(1.02);
}

.server-item img{
    width:52px;
    height:52px;

    border-radius:16px;

    object-fit:cover;
}

.server-info{
    flex:1;
}

.server-name{
    font-size:15px;
    font-weight:700;
}

.server-members{
    font-size:12px;
    color:#aaa;

    margin-top:2px;
}

.join-server{
    margin-top:8px;

    width:max-content;

    padding:5px 12px;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.08);

    font-size:11px;

    color:white;
}

</style>
</head>

<body>

<div class="card">

    <div class="avatar-wrapper">
        <img id="avatar" class="avatar">
        <img id="decoration" class="decoration" style="display:none;">
        <div id="statusDot" class="status-dot offline"></div>
    </div>

    <h2 id="displayName"></h2>

    <div class="username" id="username"></div>

    <div class="bio">
        <span id="typing"></span>
    </div>

    <div class="custom-status" id="customStatus">
        No custom status
    </div>

    <div class="activity" id="activity"></div>

    <div class="socials">
        <a href="https://instagram.com/menacexnt" target="_blank">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="https://tiktok.com/@menacexnt" target="_blank">
            <i class="fa-brands fa-tiktok"></i>
        </a>

        <a href="https://discord.com/users/1153336356345491547" target="_blank">
            <i class="fa-brands fa-discord"></i>
        </a>
    </div>
    

</div>

<div id="gate" onclick="enterSite()">
    <div class="gate-box">
        <h1>doxx me</h1>
    </div>
</div>

<div class="music-player">

    <img class="cover" src="https://i.imgur.com/F1IlCz9.jpeg">

    <div class="music-info">

        <div class="song-name">
            Raindance
        </div>

        <div class="artist-name">
            Dave
        </div>

    </div>

    <input
        type="range"
        class="progress"
        id="progress"
        value="0"
    >

    <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">

        <button>
            <i class="fa-solid fa-backward-step"></i>
        </button>

        <button
            class="play-btn"
            onclick="toggleMusic()"
        >
            <i
                id="playIcon"
                class="fa-solid fa-play"
            ></i>
        </button>

        <button>
            <i class="fa-solid fa-forward-step"></i>
        </button>

    </div>

    <div class="volume-wrap">

        <i class="fa-solid fa-volume-low"></i>

        <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

        <i class="fa-solid fa-volume-high"></i>

    </div>

    <audio
        id="player"
        src="eclipsefromheaven.mp3"
    ></audio>

</div>

<div class="servers-box" id="serversBox"></div>



<script>

const servers = [
  { 
    id: "1505626532251570256", 
    invite: "https://discord.gg/QDJm5auGC",
    icon: "https://i.imgur.com/zZTE0AT.png"
  },
  { 
    id: "1488512355313782824", 
    invite: "https://discord.gg/XEz9GeJEm",
    icon: "https://i.imgur.com/K0fhMo8.gif"
  }
];
async function loadServers() {
    const box = document.getElementById("serversBox");
    box.innerHTML = `<div class="server-title">servers</div>`;

    for (const s of servers) {
        try {
            const res = await fetch(`https://discord.com/api/v10/guilds/${s.id}/widget.json`);
            const data = await res.json();

            const name = data.name || "Unknown Server";
            const online = data.presence_count || 0;
            const inviteLink = data.instant_invite || s.invite || "#";

            const icon = data.icon
                ? `https://cdn.discordapp.com/icons/${s.id}/${data.icon}.png?size=256`
                : (s.icon || "https://cdn.discordapp.com/embed/avatars/0.png");

            box.innerHTML += `
                <a class="server-item" href="${inviteLink}" target="_blank">
                    <img src="${icon}">
                    <div class="server-info">
                        <div class="server-name">${name}</div>
                        <div class="server-members">${online} online</div>
                        <div class="join-server">Join Server</div>
                    </div>
                </a>
            `;

        } catch (err) {
            console.log("Server error:", err);
        }
    }
}

loadServers();
const userId = "1153336356345491547";

async function loadProfile(){

    const res = await fetch(
        `https://api.lanyard.rest/v1/users/${userId}`
    );

    const json = await res.json();

    const data = json.data;

    const user = data.discord_user;

    document.getElementById("displayName").innerText =
        user.display_name ||
        user.global_name ||
        user.username;

    document.getElementById("username").innerText =
        "@" + user.username;

    document.getElementById("avatar").src =
        `https://cdn.discordapp.com/avatars/${userId}/${user.avatar}.png?size=256`;

    const status = data.discord_status;

    const dot =
        document.getElementById("statusDot");

    dot.className =
        "status-dot " +
        (
            status === "online"
            ? "online"

            : status === "idle"
            ? "idle"

            : status === "dnd"
            ? "dnd"

            : "offline"
        );

    let customHTML =
        "No custom status";

    if(data.activities){

        const customActivity =
            data.activities.find(
                a => a.type === 4
            );

        if(customActivity){

            let emojiHTML = "";

            if(customActivity.emoji){

                if(customActivity.emoji.id){

                    emojiHTML =
                    `<img
                        src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.png"
                    >`;

                } else {

                    emojiHTML =
                    `<span>
                        ${customActivity.emoji.name}
                    </span>`;
                }
            }

            customHTML =
                emojiHTML +
                (customActivity.state || "");
        }
    }

    document.getElementById("customStatus").innerHTML =
        customHTML;

    let activityText = "";
    let activities = data.activities || [];

    activities = activities.filter(a => a.type !== 4);

    if(activities.length === 0){

        activityText = "No activity";

    } else {

        activityText = activities.map(a => {

            if(a.type === 0){
                return "Playing " + a.name;
            }

            if(a.type === 1){
                return "Streaming " + a.name;
            }

            if(a.type === 2){
                return "Listening to Spotify";
            }

            if(a.type === 3){
                return "Watching " + a.name;
            }

            return a.name;

        }).join(" • ");
    }

    document.getElementById("activity").innerText =
        activityText;

    if(user.avatar_decoration_data){

        const deco =
            user.avatar_decoration_data.asset;

        document.getElementById("decoration").src =
            `https://cdn.discordapp.com/avatar-decoration-presets/${deco}.png?size=256`;

        document.getElementById("decoration").style.display =
            "block";
    }
}

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

const card =
document.querySelector(".card");

document.addEventListener("click", function(e){

    if(document.getElementById("gate").style.display === "none"){

        let w =
        window.innerWidth / 2;

        let h =
        window.innerHeight / 2;

        let x =
        (e.clientX - w) / w;

        let y =
        (e.clientY - h) / h;

        targetX = y * -30;
        targetY = x * 30;
    }
});

function animateCard(){

    currentX +=
    (targetX - currentX) * 0.15;

    currentY +=
    (targetY - currentY) * 0.15;

    card.style.transform =
    `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

    requestAnimationFrame(animateCard);
}

animateCard();

let started = false;

function typeText(){

    if(started) return;

    started = true;

    const text =
    "bitches luv me";

    let i = 0;

    function run(){

        if(i < text.length){

            document.getElementById("typing").innerHTML +=
            text.charAt(i);

            i++;

            setTimeout(run, 150);
        }
    }

    run();
}

function enterSite(){

    const gate =
    document.getElementById("gate");

    gate.style.opacity = "0";

    setTimeout(() => {

        gate.style.display = "none";

        const music =
        document.getElementById("player");

        music.play();

        typeText();

        loadProfile();

    }, 600);
}

setInterval(loadProfile, 10000);

const audio =
document.getElementById("player");

const progress =
document.getElementById("progress");

const volume =
document.getElementById("volume");

const playIcon =
document.getElementById("playIcon");

const current =
document.getElementById("current");

const duration =
document.getElementById("duration");

function toggleMusic(){

    if(audio.paused){

        audio.play();

        playIcon.className =
        "fa-solid fa-pause";

    } else {

        audio.pause();

        playIcon.className =
        "fa-solid fa-play";
    }
}

audio.addEventListener(
"loadedmetadata",
() => {

    duration.innerText =
    formatTime(audio.duration);

    progress.max =
    audio.duration;
});

audio.addEventListener(
"timeupdate",
() => {

    progress.value =
    audio.currentTime;

    current.innerText =
    formatTime(audio.currentTime);
});

progress.addEventListener(
"input",
() => {

    audio.currentTime =
    progress.value;
});

volume.addEventListener(
"input",
() => {

    audio.volume =
    volume.value;
});

function formatTime(sec){

    let mins =
    Math.floor(sec / 60);

    let secs =
    Math.floor(sec % 60);

    if(secs < 10){
        secs = "0" + secs;
    }

    return mins + ":" + secs;
}

</script>

</body>
    </html>
