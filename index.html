<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@eclipse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    outline:none;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
    color:white;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:url('https://i.imgur.com/2MlFBcG.gif') center/cover no-repeat fixed;
    filter:brightness(0.45);
    z-index:-1;
}

.card{
    width:340px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.35);
    transition:transform 0.05s linear;
    position:relative;
    z-index:5;
}

.avatar-wrapper{
    position:relative;
    width:90px;
    height:90px;
    margin:auto;
}

.avatar{
    width:75px;
    height:75px;
    border-radius:50%;
    position:absolute;
    top:7px;
    left:7px;
}

.decoration{
    width:90px;
    height:90px;
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
}

.status-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    position:absolute;
    bottom:10px;
    right:12px;
    border:3px solid #1b1b1b;
}

.online{background:#43b581;}
.idle{background:#faa61a;}
.dnd{background:#f04747;}
.offline{background:#747f8d;}

h2{
    margin-top:15px;
    font-size:26px;
}

.username{
    color:#b9bbbe;
    font-size:15px;
    margin-top:3px;
}

.custom-status{
    margin-top:12px;
    color:#ddd;
    font-size:14px;
}

.custom-status img{
    width:20px;
    height:20px;
    vertical-align:middle;
    margin-right:5px;
}

.activity{
    margin-top:10px;
    color:#999;
    font-size:13px;
}

.bio{
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    color:white;
    min-height:20px;
}

#typing::after{
    content:'|';
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

#gate{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    cursor:pointer;
    transition:0.6s ease;
}

.gate-box{
    text-align:center;
    color:white;
}

.gate-box h1{
    font-size:22px;
    letter-spacing:4px;
}

.socials{
    margin-top:12px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.socials a{
    width:35px;
    height:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
    text-decoration:none;
    transition:0.2s;
}

.socials a:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

.music-player{
    position:fixed;
    top:50%;
    left:calc(50% + 230px);
    transform:translateY(-50%);

    width:260px;

    padding:14px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:0 0 25px rgba(0,0,0,.35);

    overflow:hidden;

    z-index:1;
}



.cover{
    width:100%;
    height:130px;
    border-radius:18px;
    object-fit:cover;
}

.music-info{
    margin-top:12px;
}

.song-name{
    font-size:16px;
    font-weight:700;
}

.artist-name{
    margin-top:4px;
    color:rgba(255,255,255,.7);
    font-size:13px;
}

.progress{
    width:100%;
    margin-top:16px;
    appearance:none;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
}

.time{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:rgba(255,255,255,.7);
}

.controls{
    margin-top:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.controls button{
    background:none;
    border:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.play-btn{
    font-size:42px !important;
}

.volume-wrap{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
}

.volume{
    flex:1;
    appearance:none;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
}

.volume::-webkit-slider-thumb{
    appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:white;
}

.servers-box{
    position:fixed;

    top:50%;
    right:calc(50% + 230px);

    transform:translateY(-50%);

    width:260px;

    padding:16px;

    border-radius:24px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:0 0 25px rgba(0,0,0,.35);
}

.server-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:14px;
}

.server-item{
    display:flex;
    align-items:center;

    gap:12px;

    padding:10px;

    border-radius:14px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.04);

    margin-bottom:10px;
}

.server-item img{
    width:48px;
    height:48px;

    border-radius:14px;
}

.server-name{
    font-size:15px;
    font-weight:bold;
}

.server-members{
    font-size:12px;
    color:#aaa;
}

.server-item{
    display:flex;
    align-items:center;

    gap:12px;

    padding:12px;

    border-radius:18px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.04);

    margin-bottom:12px;

    transition:.2s;
}

.server-item:hover{
    background:rgba(255,255,255,0.08);
    transform:scale(1.02);
}

.server-item img{
    width:52px;
    height:52px;

    border-radius:16px;

    object-fit:cover;
}

.server-info{
    flex:1;
}

.server-name{
    font-size:15px;
    font-weight:700;
}

.server-members{
    font-size:12px;
    color:#aaa;

    margin-top:2px;
}

.join-server{
    margin-top:8px;

    width:max-content;

    padding:5px 12px;

    border-radius:999px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.08);

    font-size:11px;

    color:white;
}

</style>
